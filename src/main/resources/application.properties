app.name=SĀTHI
app.tagline=Your Private AI Companion
spring.application.name=savan-server
server.port=8080
server.address=0.0.0.0

# Ollama Properties
spring.ai.ollama.base-url=http://localhost:11434/
spring.ai.ollama.chat.options.model=gemma:2b
spring.ai.ollama.chat.options.temperature=0.1

# Focused Q&A diagnostics; Spring AI's advisor logs stay at INFO to avoid prompt dumps.
logging.level.org.stg.savan.savanserver.controller.ChatTranscriptController=DEBUG
logging.level.org.stg.savan.savanserver.service.impl.ChatTranscriptServiceImpl=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=INFO


spring.datasource.url=jdbc:postgresql://localhost:5433/sathi
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.max-document-batch-size=10000
spring.ai.vectorstore.pgvector.initialize-schema=true

# Full transcript/question/answer logging is opt-in for local debugging.
sathi.logging.include-content=${SATHI_LOG_CONTENT:false}

# Lightweight health and Micrometer metrics for demo monitoring.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
